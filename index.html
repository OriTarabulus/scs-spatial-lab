<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCS Spatial Lab</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.34/"></script>
  <style>
    :root{--dark:#333028;--cream:#ede4d3;--line:#dedad1;--soft:#f5f2ec;--accent:#8b6f47}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#24231f}button,input,select{font:inherit}
    #app{display:grid;grid-template-columns:360px 1fr;height:100%}#sidebar{display:flex;flex-direction:column;min-width:0;background:#fff;border-right:1px solid var(--line);z-index:3}
    #sideHead{padding:17px;background:var(--dark);color:var(--cream)}#sideHead h1{margin:0 0 4px;font-size:21px}#status{font-size:12px;opacity:.84}
    .toolbar{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.darkBtn{padding:7px 9px;border:1px solid rgba(237,228,211,.45);border-radius:4px;background:transparent;color:var(--cream);cursor:pointer}.darkBtn:hover{background:rgba(255,255,255,.12)}
    .section{padding:12px 13px;border-bottom:1px solid #e8e4dc}.section label{display:block;margin-bottom:5px;font-size:12px;font-weight:700}.row{display:flex;gap:6px}.grow{flex:1;min-width:0}
    input,select{width:100%;padding:9px 10px;border:1px solid #aaa69d;border-radius:5px;background:#fff}.iconBtn{width:39px;border:1px solid #aaa69d;border-radius:5px;background:var(--soft);cursor:pointer}
    #resultCount{margin-top:7px;color:#666;font-size:12px}#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}.item{width:100%;padding:12px 14px;border:0;border-bottom:1px solid #eeeae3;background:#fff;text-align:left;cursor:pointer}.item:hover,.item:focus{background:#f1eee7;outline:none}.item.active{background:#ded8c9;font-weight:700;border-left:4px solid var(--dark);padding-left:10px}
    #mapPanel{position:relative;min-width:0;overflow:hidden}#viewDiv{position:absolute;inset:0 0 38px 0}#coordinateBar{position:absolute;bottom:0;left:0;right:0;height:38px;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(51,48,40,.94);color:var(--cream);font-size:12px}.coordActions{display:flex;gap:7px}.coordBtn{border:1px solid rgba(237,228,211,.45);border-radius:4px;background:transparent;color:var(--cream);padding:5px 8px;cursor:pointer}
    #details{position:absolute;top:14px;right:14px;z-index:7;width:min(380px,calc(100% - 28px));max-height:calc(100% - 70px);overflow:auto;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.3);display:none}#details.open{display:block}.panelHead{position:sticky;top:0;display:flex;justify-content:space-between;gap:10px;padding:15px;background:var(--dark);color:var(--cream)}.panelHead h2{margin:0;font-size:19px}.closeBtn{width:32px;height:32px;border:1px solid rgba(237,228,211,.5);border-radius:50%;background:transparent;color:var(--cream);font-size:20px;cursor:pointer}#detailsBody{padding:7px 15px 15px}.detailRow{padding:10px 0;border-bottom:1px solid #ece9e2}.detailLabel{margin-bottom:4px;color:#6b675f;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.detailValue{font-size:14px;line-height:1.45;overflow-wrap:anywhere}.detailsActions{display:flex;gap:7px;padding:12px 15px;background:var(--soft);position:sticky;bottom:0}.lightBtn{border:1px solid #aaa69d;border-radius:4px;background:#fff;padding:7px 9px;cursor:pointer}
    #tableWrap{position:absolute;left:0;right:0;bottom:38px;height:38%;z-index:8;background:#fff;border-top:3px solid var(--dark);display:none}#tableWrap.open{display:block}#tableDiv{height:100%}
    #loading{position:absolute;inset:0 0 38px 0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.78);font-weight:700;color:var(--dark)}#loading.hidden{display:none}
    @media(max-width:780px){#app{grid-template-columns:1fr;grid-template-rows:44% 56%}#sidebar{border-right:0;border-bottom:1px solid var(--line)}#sideHead{padding:11px 13px}#sideHead h1{font-size:18px}#details{top:8px;right:8px;width:calc(100% - 16px);max-height:calc(100% - 54px)}#tableWrap{height:55%}}
  </style>
</head>
<body>
<main id="app">
  <aside id="sidebar">
    <header id="sideHead"><h1>SCS Spatial Lab</h1><div id="status">Loading Team Areas...</div><div class="toolbar"><button id="reset" class="darkBtn">Reset</button><button id="clearSel" class="darkBtn">Clear selection</button><button id="toggleLayer" class="darkBtn">Hide layer</button><button id="share" class="darkBtn">Copy map link</button></div></header>
    <div class="section"><label for="search">Search Team Areas</label><div class="row"><input id="search" class="grow" type="search" placeholder="Type an area name..."><button id="clearSearch" class="iconBtn" aria-label="Clear search">×</button></div><div id="resultCount"></div></div>
    <div class="section"><label for="fieldFilter">Attribute filter</label><div class="row"><select id="fieldFilter"><option value="">Choose a field</option></select><select id="valueFilter" disabled><option value="">All values</option></select></div></div>
    <div class="section"><div class="row"><button id="tableBtn" class="lightBtn grow">Attribute table</button><button id="csvBtn" class="lightBtn grow">Export CSV</button><button id="geoBtn" class="lightBtn grow">Export GeoJSON</button></div></div>
    <ul id="list"></ul>
  </aside>
  <section id="mapPanel">
    <div id="viewDiv"></div><div id="loading">Loading map...</div>
    <aside id="details"><div class="panelHead"><h2 id="detailsTitle">Team Area</h2><button id="closeDetails" class="closeBtn" aria-label="Close">×</button></div><div id="detailsBody"></div><div class="detailsActions"><button id="zoomSelected" class="lightBtn">Zoom to area</button><button id="copyAttributes" class="lightBtn">Copy details</button></div></aside>
    <div id="tableWrap"><div id="tableDiv"></div></div>
    <div id="coordinateBar"><span id="coords">Move over the map to view coordinates</span><div class="coordActions"><button id="copyCoords" class="coordBtn">Copy coordinates</button><button id="closeTable" class="coordBtn">Close table</button></div></div>
  </section>
</main>
<script>
require([
 "esri/Map","esri/views/MapView","esri/layers/FeatureLayer","esri/layers/GraphicsLayer","esri/Graphic",
 "esri/widgets/Home","esri/widgets/Locate","esri/widgets/Legend","esri/widgets/BasemapGallery","esri/widgets/Expand","esri/widgets/ScaleBar","esri/widgets/Search","esri/widgets/Measurement","esri/widgets/FeatureTable"
],function(Map,MapView,FeatureLayer,GraphicsLayer,Graphic,Home,Locate,Legend,BasemapGallery,Expand,ScaleBar,Search,Measurement,FeatureTable){
 const URL="https://services9.arcgis.com/n6hZlg3qgjAlTZRC/arcgis/rest/services/TeamAreas_Map_WFL1/FeatureServer/1",$=id=>document.getElementById(id);
 let features=[],filtered=[],displayField,selected=null,homeExtent,lastCoords="";
 const layer=new FeatureLayer({url:URL,outFields:["*"],popupEnabled:false}),selection=new GraphicsLayer({listMode:"hide"}),map=new Map({basemap:"topo-vector",layers:[layer,selection]}),view=new MapView({container:"viewDiv",map,center:[151.8,-32.9],zoom:7});
 const table=new FeatureTable({view,layer,container:"tableDiv",visibleElements:{menuItems:{clearSelection:true,refreshData:true,toggleColumns:true,selectedRecordsShowAllToggle:true}}});
 view.ui.add(new Home({view}),"top-left");view.ui.add(new Locate({view}),"top-left");view.ui.add(new Search({view}),"top-right");view.ui.add(new ScaleBar({view,unit:"metric"}),"bottom-left");
 const legendExpand=new Expand({view,content:new Legend({view}),expandIcon:"legend",expandTooltip:"Legend",group:"tools"});
 const baseExpand=new Expand({view,content:new BasemapGallery({view}),expandIcon:"basemap",expandTooltip:"Basemaps",group:"tools"});
 const measurement=new Measurement({view,activeTool:null});const measureExpand=new Expand({view,content:measurement,expandIcon:"measure",expandTooltip:"Measure",group:"tools"});view.ui.add([legendExpand,baseExpand,measureExpand],"top-right");
 const label=f=>String((f.attributes||{})[displayField]??(f.attributes||{})[layer.objectIdField]??"Unnamed area");
 const sys=f=>f.type==="oid"||f.type==="geometry"||["Shape__Area","Shape__Length","GlobalID","CreationDate","Creator","EditDate","Editor"].includes(f.name);
 function val(v,f){if(v===null||v===undefined||v==="")return null;if(f.domain&&f.domain.codedValues){const m=f.domain.codedValues.find(x=>String(x.code)===String(v));if(m)return m.name}if(f.type==="date"){const d=new Date(v);if(!isNaN(d))return new Intl.DateTimeFormat("en-AU",{day:"2-digit",month:"short",year:"numeric"}).format(d)}return String(v)}
 function detailText(f){return layer.fields.filter(x=>!sys(x)).map(x=>{const v=val(f.attributes[x.name],x);return v===null?null:`${x.alias||x.name}: ${v}`}).filter(Boolean).join("\n")}
 function showDetails(f){$("detailsTitle").textContent=label(f);$("detailsBody").innerHTML="";let count=0;layer.fields.forEach(field=>{if(sys(field))return;const v=val(f.attributes[field.name],field);if(v===null)return;const row=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div");row.className="detailRow";a.className="detailLabel";b.className="detailValue";a.textContent=field.alias||field.name;b.textContent=v;row.append(a,b);$("detailsBody").append(row);count++});if(!count)$("detailsBody").textContent="No populated attributes returned.";$("details").classList.add("open")}
 function select(f,zoom=true){selected=f;document.querySelectorAll(".item").forEach(x=>x.classList.toggle("active",x.dataset.oid===String(f.attributes[layer.objectIdField])));selection.removeAll();selection.add(new Graphic({geometry:f.geometry,symbol:{type:"simple-fill",color:[255,215,0,.18],outline:{color:[51,48,40],width:3}}}));showDetails(f);table.highlightIds.removeAll();table.highlightIds.add(f.attributes[layer.objectIdField]);if(zoom)view.goTo(f.geometry.extent?f.geometry.extent.expand(1.45):f.geometry).catch(()=>{})}
 function clearSelection(){selected=null;selection.removeAll();$("details").classList.remove("open");document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));table.highlightIds.removeAll()}
 function render(){const q=$("search").value.trim().toLowerCase(),field=$("fieldFilter").value,fv=$("valueFilter").value;filtered=features.filter(f=>label(f).toLowerCase().includes(q)&&(!field||!fv||String(f.attributes[field])===fv));$("list").innerHTML="";$("resultCount").textContent=`${filtered.length} ${filtered.length===1?"area":"areas"}`;filtered.forEach(f=>{const li=document.createElement("li"),b=document.createElement("button");b.className="item";b.textContent=label(f);b.dataset.oid=f.attributes[layer.objectIdField];if(selected&&b.dataset.oid===String(selected.attributes[layer.objectIdField]))b.classList.add("active");b.onclick=()=>select(f,true);li.append(b);$("list").append(li)})}
 function buildFields(){layer.fields.filter(f=>!sys(f)&&["string","small-integer","integer"].includes(f.type)).forEach(f=>{const o=document.createElement("option");o.value=f.name;o.textContent=f.alias||f.name;$("fieldFilter").append(o)})}
 function buildValues(){const field=$("fieldFilter").value;$("valueFilter").innerHTML='<option value="">All values</option>';$("valueFilter").disabled=!field;if(!field)return render();[...new Set(features.map(f=>f.attributes[field]).filter(v=>v!==null&&v!==undefined&&v!==""))].sort((a,b)=>String(a).localeCompare(String(b))).forEach(v=>{const o=document.createElement("option");o.value=String(v);const fd=layer.fields.find(x=>x.name===field);o.textContent=val(v,fd);$("valueFilter").append(o)});render()}
 function download(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
 function csv(){const fields=layer.fields.filter(f=>!sys(f));const esc=s=>'"'+String(s??"").replaceAll('"','""')+'"';const rows=[fields.map(f=>esc(f.alias||f.name)).join(","),...filtered.map(ft=>fields.map(f=>esc(val(ft.attributes[f.name],f)??"")).join(","))];download("team-areas.csv","text/csv",rows.join("\n"))}
 function geojson(){const fc={type:"FeatureCollection",features:filtered.map(f=>({type:"Feature",properties:f.attributes,geometry:f.geometry.toJSON?{type:"Polygon",coordinates:f.geometry.rings}:null}))};download("team-areas.geojson","application/geo+json",JSON.stringify(fc,null,2))}
 $("search").oninput=render;$("clearSearch").onclick=()=>{$("search").value="";render()};$("fieldFilter").onchange=buildValues;$("valueFilter").onchange=render;$("closeDetails").onclick=clearSelection;$("clearSel").onclick=clearSelection;$("zoomSelected").onclick=()=>selected&&select(selected,true);$("copyAttributes").onclick=()=>selected&&navigator.clipboard.writeText(detailText(selected));
 $("reset").onclick=()=>{clearSelection();$("search").value="";$("fieldFilter").value="";buildValues();if(homeExtent)view.goTo(homeExtent)};$("toggleLayer").onclick=()=>{layer.visible=!layer.visible;$("toggleLayer").textContent=layer.visible?"Hide layer":"Show layer"};
 $("tableBtn").onclick=()=>$("tableWrap").classList.toggle("open");$("closeTable").onclick=()=>$("tableWrap").classList.remove("open");$("csvBtn").onclick=csv;$("geoBtn").onclick=geojson;
 $("copyCoords").onclick=()=>lastCoords&&navigator.clipboard.writeText(lastCoords);$("share").onclick=()=>{const u=new URL(location.href);u.searchParams.set("x",view.center.longitude.toFixed(6));u.searchParams.set("y",view.center.latitude.toFixed(6));u.searchParams.set("z",view.zoom.toFixed(2));if(selected)u.searchParams.set("oid",selected.attributes[layer.objectIdField]);navigator.clipboard.writeText(u.toString());$("share").textContent="Link copied";setTimeout(()=>$("share").textContent="Copy map link",1400)};
 view.on("pointer-move",e=>{const p=view.toMap(e);if(p){lastCoords=`${p.latitude.toFixed(6)}, ${p.longitude.toFixed(6)}`;$("coords").textContent=`Lat ${p.latitude.toFixed(6)} | Lon ${p.longitude.toFixed(6)}`}});view.on("click",e=>view.hitTest(e,{include:layer}).then(r=>{const h=r.results.find(x=>x.graphic&&x.graphic.layer===layer);if(h)select(h.graphic,false)}));
 Promise.all([layer.load(),view.when()]).then(()=>{displayField=layer.displayField||layer.objectIdField;homeExtent=layer.fullExtent&&layer.fullExtent.expand(1.1);return layer.queryFeatures({where:"1=1",outFields:["*"],returnGeometry:true,orderByFields:displayField?[displayField]:[]})}).then(r=>{features=r.features;filtered=features;buildFields();render();$("status").textContent="Team Areas loaded";$("loading").classList.add("hidden");const u=new URL(location.href),x=+u.searchParams.get("x"),y=+u.searchParams.get("y"),z=+u.searchParams.get("z"),oid=u.searchParams.get("oid");if(Number.isFinite(x)&&Number.isFinite(y))view.goTo({center:[x,y],zoom:Number.isFinite(z)?z:7});else if(homeExtent)view.goTo(homeExtent);if(oid){const f=features.find(ft=>String(ft.attributes[layer.objectIdField])===oid);if(f)select(f,false)}}).catch(e=>{$("status").textContent="Unable to load Team Areas";$("loading").textContent="Map failed to load. Check the browser console.";console.error(e)});
});
</script>
</body>
</html>
