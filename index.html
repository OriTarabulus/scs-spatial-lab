<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCS Spatial Lab</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <link rel="stylesheet" href="styles.css">

  <script src="https://js.arcgis.com/4.34/"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app">
    <aside id="sidebar">
      <header id="sideHead">
        <h1 id="appTitle">SCS Spatial Lab</h1>
        <div id="status">Loading Team Areas...</div>
        <div class="toolbar">
          <button id="reset" class="darkBtn" type="button">Reset</button>
          <button id="clearSel" class="darkBtn" type="button">Clear selection</button>
          <button id="toggleLayer" class="darkBtn" type="button">Hide layer</button>
          <button id="share" class="darkBtn" type="button">Copy map link</button>
        </div>
      </header>

      <section class="section">
        <label for="search">Search Team Areas</label>
        <div class="row">
          <input id="search" class="grow" type="search" placeholder="Type an area name..." autocomplete="off">
          <button id="clearSearch" class="iconBtn" type="button" aria-label="Clear search">×</button>
        </div>
        <div id="resultCount"></div>
      </section>

      <section class="section">
        <label for="fieldFilter">Attribute filter</label>
        <div class="row">
          <select id="fieldFilter"><option value="">Choose a field</option></select>
          <select id="valueFilter" disabled><option value="">All values</option></select>
        </div>
      </section>

      <section class="section">
        <div class="row">
          <button id="tableBtn" class="lightBtn grow" type="button">Attribute table</button>
          <button id="csvBtn" class="lightBtn grow" type="button">Export CSV</button>
          <button id="geoBtn" class="lightBtn grow" type="button">Export GeoJSON</button>
        </div>
      </section>

      <ul id="list" aria-label="Team Area results"></ul>
    </aside>

    <section id="mapPanel" aria-label="Interactive map">
      <div id="viewDiv"></div>
      <div id="loading">Loading map...</div>

      <aside id="details" aria-live="polite">
        <div class="panelHead">
          <h2 id="detailsTitle">Team Area</h2>
          <button id="closeDetails" class="closeBtn" type="button" aria-label="Close">×</button>
        </div>
        <div id="detailsBody"></div>
        <div class="detailsActions">
          <button id="zoomSelected" class="lightBtn" type="button">Zoom to area</button>
          <button id="copyAttributes" class="lightBtn" type="button">Copy details</button>
        </div>
      </aside>

      <div id="tableWrap"><div id="tableDiv"></div></div>

      <footer id="coordinateBar">
        <span id="coords">Move over the map to view coordinates</span>
        <div class="coordActions">
          <button id="copyCoords" class="coordBtn" type="button">Copy coordinates</button>
          <button id="closeTable" class="coordBtn" type="button">Close table</button>
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
