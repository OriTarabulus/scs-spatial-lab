<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCS Spatial Lab</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.34/"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; font-family:Arial,sans-serif; color:#24231f; }
    #app { display:grid; grid-template-columns:350px 1fr; height:100%; }
    #sidebar { display:flex; flex-direction:column; min-width:0; background:#fff; border-right:1px solid #d8d5ce; z-index:2; }
    #sidebarHeader { padding:20px; background:#333028; color:#ede4d3; }
    #sidebarHeader h1 { margin:0 0 6px; font-size:21px; }
    #status { font-size:12px; opacity:.85; }
    #searchWrap { padding:14px; border-bottom:1px solid #e3e0da; }
    #searchInput { width:100%; padding:10px 12px; border:1px solid #aaa69d; border-radius:5px; font-size:14px; }
    #resultCount { margin-top:8px; color:#666; font-size:12px; }
    #featureList { flex:1; overflow-y:auto; margin:0; padding:0; list-style:none; }
    .featureItem { width:100%; padding:13px 16px; border:0; border-bottom:1px solid #ece9e2; background:#fff; text-align:left; font-size:14px; cursor:pointer; }
    .featureItem:hover,.featureItem:focus { background:#f1eee7; outline:none; }
    .featureItem.active { background:#ded8c9; font-weight:700; border-left:4px solid #333028; padding-left:12px; }
    #mapPanel { position:relative; min-width:0; }
    #viewDiv { position:absolute; inset:0; }
    #detailsPanel { position:absolute; top:16px; right:16px; z-index:5; width:min(360px,calc(100% - 32px)); max-height:calc(100% - 32px); overflow:auto; background:#fff; border-radius:8px; box-shadow:0 5px 22px rgba(0,0,0,.28); display:none; }
    #detailsPanel.open { display:block; }
    #detailsHeader { position:sticky; top:0; display:flex; justify-content:space-between; gap:12px; padding:16px 16px 14px; background:#333028; color:#ede4d3; }
    #detailsTitle { margin:0; font-size:19px; line-height:1.3; }
    #closeDetails { flex:0 0 auto; width:32px; height:32px; border:1px solid rgba(237,228,211,.55); border-radius:50%; background:transparent; color:#ede4d3; font-size:20px; cursor:pointer; }
    #detailsBody { padding:8px 16px 18px; }
    .detailRow { padding:11px 0; border-bottom:1px solid #ece9e2; }
    .detailLabel { margin-bottom:4px; color:#6b675f; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .detailValue { color:#24231f; font-size:14px; line-height:1.45; overflow-wrap:anywhere; }
    #emptyDetails { color:#6b675f; font-size:14px; }
    @media(max-width:760px){
      #app{grid-template-columns:1fr;grid-template-rows:42% 58%;}
      #sidebar{border-right:0;border-bottom:1px solid #d8d5ce;}
      #sidebarHeader{padding:12px 14px;}
      #sidebarHeader h1{font-size:18px;}
      #detailsPanel{top:8px;right:8px;width:calc(100% - 16px);max-height:calc(100% - 16px);}
    }
  </style>
</head>
<body>
<main id="app">
  <aside id="sidebar" aria-label="Team Areas">
    <header id="sidebarHeader"><h1>SCS Spatial Lab</h1><div id="status">Loading Team Areas...</div></header>
    <div id="searchWrap">
      <label for="searchInput">Search Team Areas</label>
      <input id="searchInput" type="search" placeholder="Type an area name..." autocomplete="off">
      <div id="resultCount"></div>
    </div>
    <ul id="featureList" aria-label="Team Area results"></ul>
  </aside>
  <section id="mapPanel" aria-label="Interactive map">
    <div id="viewDiv"></div>
    <aside id="detailsPanel" aria-live="polite">
      <div id="detailsHeader"><h2 id="detailsTitle">Team Area</h2><button id="closeDetails" type="button" aria-label="Close details">×</button></div>
      <div id="detailsBody"></div>
    </aside>
  </section>
</main>
<script>
require(["esri/Map","esri/views/MapView","esri/layers/FeatureLayer"], function(Map,MapView,FeatureLayer){
  const layerUrl="https://services9.arcgis.com/n6hZlg3qgjAlTZRC/arcgis/rest/services/TeamAreas_Map_WFL1/FeatureServer/1";
  const statusElement=document.getElementById("status"), searchInput=document.getElementById("searchInput"), featureList=document.getElementById("featureList"), resultCount=document.getElementById("resultCount"), detailsPanel=document.getElementById("detailsPanel"), detailsTitle=document.getElementById("detailsTitle"), detailsBody=document.getElementById("detailsBody"), closeDetails=document.getElementById("closeDetails");
  let allFeatures=[], displayField=null, selectedObjectId=null;
  const teamLayer=new FeatureLayer({url:layerUrl,outFields:["*"],popupEnabled:false});
  const map=new Map({basemap:"topo-vector",layers:[teamLayer]});
  const view=new MapView({container:"viewDiv",map:map,center:[151.8,-32.9],zoom:7});

  function label(feature){const a=feature.attributes||{};const v=a[displayField]??a[teamLayer.objectIdField];return v==null?"Unnamed area":String(v);}
  function prettyName(name){return String(name).replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\b\w/g,c=>c.toUpperCase());}
  function formatValue(value,field){
    if(value===null||value===undefined||value==="") return null;
    if(field && field.domain && field.domain.codedValues){const match=field.domain.codedValues.find(x=>String(x.code)===String(value));if(match)return match.name;}
    if(field && field.type==="date"){const d=new Date(value);if(!isNaN(d))return new Intl.DateTimeFormat("en-AU",{day:"2-digit",month:"short",year:"numeric"}).format(d);}
    return String(value);
  }
  function showDetails(feature){
    detailsTitle.textContent=label(feature); detailsBody.innerHTML="";
    const hidden=new Set([teamLayer.objectIdField,"Shape__Area","Shape__Length","GlobalID","CreationDate","Creator","EditDate","Editor"]);
    let shown=0;
    teamLayer.fields.forEach(function(field){
      if(hidden.has(field.name)||field.name===displayField||field.type==="oid"||field.type==="geometry")return;
      const value=formatValue(feature.attributes[field.name],field); if(value===null)return;
      const row=document.createElement("div"); row.className="detailRow";
      const l=document.createElement("div"); l.className="detailLabel"; l.textContent=field.alias||prettyName(field.name);
      const v=document.createElement("div"); v.className="detailValue"; v.textContent=value;
      row.append(l,v); detailsBody.appendChild(row); shown++;
    });
    if(!shown){const empty=document.createElement("p");empty.id="emptyDetails";empty.textContent="No additional details are available for this area.";detailsBody.appendChild(empty);}
    detailsPanel.classList.add("open");
  }
  function selectFeature(feature,zoom=true){
    const oid=feature.attributes[teamLayer.objectIdField]; selectedObjectId=oid;
    document.querySelectorAll(".featureItem").forEach(item=>item.classList.toggle("active",item.dataset.objectId===String(oid)));
    showDetails(feature);
    if(zoom){const target=feature.geometry.extent?feature.geometry.extent.expand(1.5):feature.geometry;view.goTo(target).catch(e=>{if(e.name!=="AbortError")console.error(e);});}
  }
  function render(features){featureList.innerHTML="";resultCount.textContent=features.length+(features.length===1?" area":" areas");features.forEach(function(feature){const li=document.createElement("li"),b=document.createElement("button"),oid=feature.attributes[teamLayer.objectIdField];b.type="button";b.className="featureItem";b.textContent=label(feature);b.dataset.objectId=oid;if(oid===selectedObjectId)b.classList.add("active");b.addEventListener("click",()=>selectFeature(feature,true));li.appendChild(b);featureList.appendChild(li);});}
  function filter(){const q=searchInput.value.trim().toLowerCase();render(allFeatures.filter(f=>label(f).toLowerCase().includes(q)));}
  searchInput.addEventListener("input",filter);
  closeDetails.addEventListener("click",()=>{detailsPanel.classList.remove("open");selectedObjectId=null;document.querySelectorAll(".featureItem").forEach(x=>x.classList.remove("active"));});
  view.on("click",function(event){view.hitTest(event,{include:teamLayer}).then(function(response){const hit=response.results.find(r=>r.graphic&&r.graphic.layer===teamLayer);if(hit)selectFeature(hit.graphic,false);});});
  Promise.all([teamLayer.load(),view.when()]).then(function(){displayField=teamLayer.displayField||teamLayer.objectIdField;return teamLayer.queryFeatures({where:"1=1",outFields:["*"],returnGeometry:true,orderByFields:displayField?[displayField]:[]});}).then(function(result){allFeatures=result.features;render(allFeatures);statusElement.textContent="Team Areas loaded";if(teamLayer.fullExtent)view.goTo(teamLayer.fullExtent.expand(1.1));}).catch(function(error){statusElement.textContent="Unable to load Team Areas";resultCount.textContent="Check the browser console for details.";console.error("Team Areas application error:",error);});
});
</script>
</body>
</html>
