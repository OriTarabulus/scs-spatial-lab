<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCS Spatial Lab</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.34/"></script>
  <style>
    *{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#24231f}
    button,input{font:inherit} #app{display:grid;grid-template-columns:350px 1fr;height:100%}
    #sidebar{display:flex;flex-direction:column;min-width:0;background:#fff;border-right:1px solid #d8d5ce;z-index:2}
    #sidebarHeader{padding:18px;background:#333028;color:#ede4d3} #sidebarHeader h1{margin:0 0 5px;font-size:21px}
    #status{font-size:12px;opacity:.86}.sidebarTools{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
    .darkBtn{padding:7px 9px;border:1px solid rgba(237,228,211,.5);border-radius:4px;background:transparent;color:#ede4d3;cursor:pointer}
    .darkBtn:hover{background:rgba(255,255,255,.12)}
    #searchWrap{padding:13px;border-bottom:1px solid #e3e0da}.searchRow{display:flex;gap:6px;margin-top:5px}
    #searchInput{min-width:0;flex:1;padding:9px 10px;border:1px solid #aaa69d;border-radius:5px}
    #clearSearch{width:38px;border:1px solid #aaa69d;border-radius:5px;background:#f5f3ee;cursor:pointer}
    #resultCount{margin-top:7px;color:#666;font-size:12px}#featureList{flex:1;overflow-y:auto;margin:0;padding:0;list-style:none}
    .featureItem{width:100%;padding:12px 15px;border:0;border-bottom:1px solid #ece9e2;background:#fff;text-align:left;cursor:pointer}
    .featureItem:hover,.featureItem:focus{background:#f1eee7;outline:none}.featureItem.active{background:#ded8c9;font-weight:700;border-left:4px solid #333028;padding-left:11px}
    #mapPanel{position:relative;min-width:0}#viewDiv{position:absolute;inset:0}
    #detailsPanel{position:absolute;top:15px;right:15px;z-index:5;width:min(370px,calc(100% - 30px));max-height:calc(100% - 30px);overflow:auto;background:#fff;border-radius:8px;box-shadow:0 5px 22px rgba(0,0,0,.28);display:none}
    #detailsPanel.open{display:block}#detailsHeader{position:sticky;top:0;display:flex;justify-content:space-between;gap:12px;padding:15px;background:#333028;color:#ede4d3}
    #detailsTitle{margin:0;font-size:19px;line-height:1.3}#closeDetails{width:32px;height:32px;border:1px solid rgba(237,228,211,.55);border-radius:50%;background:transparent;color:#ede4d3;font-size:20px;cursor:pointer}
    #detailsBody{padding:7px 15px 17px}.detailRow{padding:10px 0;border-bottom:1px solid #ece9e2}.detailLabel{margin-bottom:4px;color:#6b675f;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.detailValue{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
    #loadingMask{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.76);font-weight:700;color:#333028}#loadingMask.hidden{display:none}
    .widgetPanel{width:280px;max-height:420px;overflow:auto;background:#fff}
    @media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:44% 56%}#sidebar{border-right:0;border-bottom:1px solid #d8d5ce}#sidebarHeader{padding:11px 13px}#sidebarHeader h1{font-size:18px}#detailsPanel{top:8px;right:8px;width:calc(100% - 16px);max-height:calc(100% - 16px)}}
  </style>
</head>
<body>
<main id="app">
  <aside id="sidebar" aria-label="Team Areas">
    <header id="sidebarHeader">
      <h1>SCS Spatial Lab</h1><div id="status">Loading Team Areas...</div>
      <div class="sidebarTools">
        <button id="resetMap" class="darkBtn" type="button">Reset map</button>
        <button id="clearSelection" class="darkBtn" type="button">Clear selection</button>
        <button id="toggleLayer" class="darkBtn" type="button">Hide layer</button>
      </div>
    </header>
    <div id="searchWrap">
      <label for="searchInput">Search Team Areas</label>
      <div class="searchRow"><input id="searchInput" type="search" placeholder="Type an area name..." autocomplete="off"><button id="clearSearch" type="button" aria-label="Clear search">×</button></div>
      <div id="resultCount"></div>
    </div>
    <ul id="featureList" aria-label="Team Area results"></ul>
  </aside>
  <section id="mapPanel" aria-label="Interactive map">
    <div id="viewDiv"></div><div id="loadingMask">Loading map...</div>
    <aside id="detailsPanel" aria-live="polite"><div id="detailsHeader"><h2 id="detailsTitle">Team Area</h2><button id="closeDetails" type="button" aria-label="Close details">×</button></div><div id="detailsBody"></div></aside>
  </section>
</main>
<script>
require([
  "esri/Map","esri/views/MapView","esri/layers/FeatureLayer","esri/layers/GraphicsLayer","esri/Graphic",
  "esri/widgets/Home","esri/widgets/Locate","esri/widgets/Legend","esri/widgets/BasemapGallery","esri/widgets/Expand","esri/widgets/ScaleBar"
],function(Map,MapView,FeatureLayer,GraphicsLayer,Graphic,Home,Locate,Legend,BasemapGallery,Expand,ScaleBar){
  const layerUrl="https://services9.arcgis.com/n6hZlg3qgjAlTZRC/arcgis/rest/services/TeamAreas_Map_WFL1/FeatureServer/1";
  const $=id=>document.getElementById(id); let allFeatures=[],displayField=null,selectedObjectId=null,homeExtent=null;
  const teamLayer=new FeatureLayer({url:layerUrl,outFields:["*"],popupEnabled:false});
  const selectionLayer=new GraphicsLayer({listMode:"hide"});
  const map=new Map({basemap:"topo-vector",layers:[teamLayer,selectionLayer]});
  const view=new MapView({container:"viewDiv",map,center:[151.8,-32.9],zoom:7,highlightOptions:{color:[255,255,0,1],haloOpacity:.9,fillOpacity:.12}});

  const home=new Home({view}); const locate=new Locate({view}); const legend=new Legend({view}); const gallery=new BasemapGallery({view});
  const legendExpand=new Expand({view,content:legend,expandIcon:"legend",expandTooltip:"Legend",group:"top-right"});
  const basemapExpand=new Expand({view,content:gallery,expandIcon:"basemap",expandTooltip:"Basemaps",group:"top-right"});
  view.ui.add(home,"top-left"); view.ui.add(locate,"top-left"); view.ui.add([legendExpand,basemapExpand],"top-right"); view.ui.add(new ScaleBar({view,unit:"metric"}),"bottom-left");

  function label(feature){const a=feature.attributes||{},v=a[displayField]??a[teamLayer.objectIdField];return v==null?"Unnamed area":String(v)}
  function formatValue(value,field){if(value===null||value===undefined||value==="")return null;if(field.domain&&field.domain.codedValues){const m=field.domain.codedValues.find(x=>String(x.code)===String(value));if(m)return m.name}if(field.type==="date"){const d=new Date(value);if(!isNaN(d))return new Intl.DateTimeFormat("en-AU",{day:"2-digit",month:"short",year:"numeric"}).format(d)}return String(value)}
  function systemField(field){return field.type==="oid"||field.type==="geometry"||["Shape__Area","Shape__Length","GlobalID","CreationDate","Creator","EditDate","Editor"].includes(field.name)}
  function showDetails(feature){$("detailsTitle").textContent=label(feature);$("detailsBody").innerHTML="";let shown=0;teamLayer.fields.forEach(field=>{if(systemField(field))return;const value=formatValue(feature.attributes[field.name],field);if(value===null)return;const row=document.createElement("div"),lab=document.createElement("div"),val=document.createElement("div");row.className="detailRow";lab.className="detailLabel";val.className="detailValue";lab.textContent=field.alias||field.name;val.textContent=value;row.append(lab,val);$("detailsBody").appendChild(row);shown++});if(!shown)$("detailsBody").textContent="No populated attributes were returned for this feature.";$("detailsPanel").classList.add("open")}
  function drawSelection(feature){selectionLayer.removeAll();selectionLayer.add(new Graphic({geometry:feature.geometry,symbol:{type:"simple-fill",color:[255,215,0,.18],outline:{color:[51,48,40,1],width:3}}}))}
  function selectFeature(feature,zoom=true){selectedObjectId=feature.attributes[teamLayer.objectIdField];document.querySelectorAll(".featureItem").forEach(i=>i.classList.toggle("active",i.dataset.objectId===String(selectedObjectId)));drawSelection(feature);showDetails(feature);if(zoom){const target=feature.geometry.extent?feature.geometry.extent.expand(1.45):feature.geometry;view.goTo(target).catch(e=>{if(e.name!=="AbortError")console.error(e)})}}
  function clearSelection(){selectedObjectId=null;selectionLayer.removeAll();$("detailsPanel").classList.remove("open");document.querySelectorAll(".featureItem").forEach(i=>i.classList.remove("active"))}
  function render(features){$("featureList").innerHTML="";$("resultCount").textContent=features.length+(features.length===1?" area":" areas");features.forEach(feature=>{const li=document.createElement("li"),b=document.createElement("button"),oid=feature.attributes[teamLayer.objectIdField];b.type="button";b.className="featureItem";b.textContent=label(feature);b.dataset.objectId=oid;if(oid===selectedObjectId)b.classList.add("active");b.onclick=()=>selectFeature(feature,true);li.appendChild(b);$("featureList").appendChild(li)})}
  function filter(){const q=$("searchInput").value.trim().toLowerCase();render(allFeatures.filter(f=>label(f).toLowerCase().includes(q)))}
  $("searchInput").addEventListener("input",filter);$("clearSearch").onclick=()=>{$("searchInput").value="";filter();$("searchInput").focus()};$("closeDetails").onclick=clearSelection;$("clearSelection").onclick=clearSelection;
  $("resetMap").onclick=()=>{clearSelection();if(homeExtent)view.goTo(homeExtent)};
  $("toggleLayer").onclick=()=>{teamLayer.visible=!teamLayer.visible;$("toggleLayer").textContent=teamLayer.visible?"Hide layer":"Show layer";if(!teamLayer.visible)clearSelection()};
  view.on("click",event=>view.hitTest(event,{include:teamLayer}).then(response=>{const hit=response.results.find(r=>r.graphic&&r.graphic.layer===teamLayer);if(hit)selectFeature(hit.graphic,false)}));

  Promise.all([teamLayer.load(),view.when()]).then(()=>{displayField=teamLayer.displayField||teamLayer.objectIdField;homeExtent=teamLayer.fullExtent&&teamLayer.fullExtent.expand(1.1);return teamLayer.queryFeatures({where:"1=1",outFields:["*"],returnGeometry:true,orderByFields:displayField?[displayField]:[]})}).then(result=>{allFeatures=result.features;render(allFeatures);$("status").textContent="Team Areas loaded";$("loadingMask").classList.add("hidden");if(homeExtent)view.goTo(homeExtent)}).catch(error=>{$("status").textContent="Unable to load Team Areas";$("loadingMask").textContent="Map failed to load. Open the browser console for details.";console.error(error)});
});
</script>
</body>
</html>
